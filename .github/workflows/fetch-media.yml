name: Fetch large media (one-time)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify
        run: |
          set -e
          dl() { mkdir -p "$(dirname "$1")"; curl -fsSL --retry 3 "https://heyyanixx.sites.tab.bot/$1" -o "$1"; echo "$2  $1" | sha256sum -c -; }
          dl ads/heyyanixx-ad-v1.mp4 2bc9dd793cc66559fe08f0e69d8d315a6398794f0e7cf4f56f6d4ce93f08dbae
          dl ads/heyyanixx-ad-v2.mp4 f24051e5aef8ef9ea9e915d9bad80a2b000db12f68d859019f0fdfe75cecf46e
          dl assets/work/aroma-dumka-promo.mp4 85633a274e8bf71f5240f5bb2ef6eb6862874bf29fafcac2f5c80f46d276528d
      - name: Commit
        run: |
          git config user.name "heyyanixx"
          git config user.email "323572159+heyyanixx@users.noreply.github.com"
          git rm -q .github/workflows/fetch-media.yml
          git add ads assets/work
          git commit -m "Add ad videos and Aroma promo video"
          git push
